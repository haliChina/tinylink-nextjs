<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">TinyLink — short URLs with a redirect notice</title><desc id="d">Create short codes backed by PostgreSQL, show a five-second destination notice, redirect, and record click statistics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient><clipPath id="c"><rect width="1200" height="540" rx="28"/></clipPath></defs><g clip-path="url(#c)"><rect width="1200" height="540" fill="url(#bg)"/><circle cx="1120" cy="-70" r="260" fill="#2563EB" opacity=".08"/><path d="M0 474H1200" stroke="#B7C8E2"/>
<g transform="translate(64 62)" font-family="Arial,Helvetica,sans-serif"><rect width="246" height="36" rx="18" fill="#DBEAFE" stroke="#60A5FA"/><circle cx="20" cy="18" r="5" fill="#2563EB"/><text x="36" y="24" fill="#1D4ED8" font-size="15" font-weight="700">SHORT LINK SERVICE</text><text x="0" y="135" fill="#0F172A" font-size="72" font-weight="800">TinyLink</text><text x="0" y="191" fill="#2563EB" font-size="34" font-weight="700">SHORT · WARN · COUNT</text><text x="0" y="246" fill="#334155" font-size="22">Custom codes with click analytics.</text><text x="0" y="280" fill="#64748B" font-size="19">A 5-second notice precedes redirect.</text><g transform="translate(0 327)" font-family="monospace" font-size="15"><rect width="169" height="42" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="21" y="27" fill="#1E40AF">NEXT.JS API</text><rect x="181" width="186" height="42" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/><text x="203" y="27" fill="#1E40AF">POSTGRESQL</text></g></g>
<g transform="translate(510 56)" font-family="Arial,Helvetica,sans-serif"><rect width="632" height="397" rx="22" fill="#FFFFFF" stroke="#B7C8E2"/><text x="28" y="38" fill="#64748B" font-family="monospace" font-size="15">REDIRECT JOURNEY</text><g transform="translate(28 70)"><rect width="576" height="76" rx="13" fill="#F8FAFC" stroke="#CBD5E1"/><text x="21" y="31" fill="#64748B" font-family="monospace" font-size="13">DESTINATION</text><text x="21" y="57" fill="#0F172A" font-family="monospace" font-size="17">https://example.com/long/campaign/path</text><path d="M425 38H461M452 29L461 38L452 47" fill="none" stroke="#64748B" stroke-width="2"/><rect x="476" y="17" width="82" height="42" rx="8" fill="#DBEAFE" stroke="#60A5FA"/><text x="517" y="43" text-anchor="middle" fill="#1D4ED8" font-family="monospace" font-size="16">/A8B3K2</text></g>
<g transform="translate(28 177)"><g><rect width="169" height="127" rx="14" fill="#EFF6FF" stroke="#93C5FD"/><text x="18" y="30" fill="#2563EB" font-family="monospace" font-size="14">01 / CREATE</text><text x="18" y="65" fill="#0F172A" font-size="21" font-weight="700">SAVE CODE</text><text x="18" y="94" fill="#64748B" font-size="15">URL validation</text><text x="18" y="116" fill="#64748B" font-size="15">PostgreSQL row</text></g><path d="M179 64H207M198 55L207 64L198 73" fill="none" stroke="#64748B" stroke-width="2"/><g transform="translate(217 0)"><rect width="169" height="127" rx="14" fill="#FFF7ED" stroke="#FDBA74"/><text x="18" y="30" fill="#C2410C" font-family="monospace" font-size="14">02 / NOTICE</text><text x="18" y="65" fill="#431407" font-size="21" font-weight="700">5 SECONDS</text><text x="18" y="94" fill="#9A3412" font-size="15">show destination</text><text x="18" y="116" fill="#9A3412" font-size="15">continue or cancel</text></g><path d="M396 64H424M415 55L424 64L415 73" fill="none" stroke="#64748B" stroke-width="2"/><g transform="translate(434 0)"><rect width="142" height="127" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/><text x="18" y="30" fill="#047857" font-family="monospace" font-size="14">03 / OPEN</text><text x="18" y="65" fill="#064E3B" font-size="21" font-weight="700">REDIRECT</text><text x="18" y="94" fill="#047857" font-size="15">clicks + 1</text><text x="18" y="116" fill="#047857" font-size="15">timestamp</text></g></g><rect x="28" y="329" width="576" height="42" rx="9" fill="#FEF2F2" stroke="#FCA5A5"/><text x="316" y="355" text-anchor="middle" fill="#B91C1C" font-family="monospace" font-size="14">NOTICE IS NOT A GUARANTEE OF DESTINATION SAFETY</text></g><g transform="translate(64 510)" fill="#64748B" font-family="monospace" font-size="15"><text>CREATE → REVIEW DESTINATION → REDIRECT → ANALYTICS</text><text x="953">VERCEL</text></g></g></svg>