<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">TinyLink service and management boundary</title><desc id="d">Public API routes create, list, inspect, and delete database records; redirect validation and the notice page reduce some risk but are not complete threat detection.</desc><rect width="1200" height="490" rx="24" fill="#F8FAFC"/><path d="M0 112H1200M0 400H1200" stroke="#CBD5E1"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="51" fill="#2563EB" font-family="monospace" font-size="17">SERVICE FLOW / ADMIN BOUNDARY</text><text x="58" y="94" fill="#0F172A" font-size="36" font-weight="800">The dashboard API is public in the current code</text>
<g transform="translate(58 151)"><rect width="244" height="197" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/><text x="20" y="34" fill="#2563EB" font-family="monospace" font-size="15">NEXT.JS UI</text><text x="20" y="72" fill="#0F172A" font-size="22" font-weight="700">DASHBOARD</text><text x="20" y="104" fill="#475569" font-size="16">create · list · delete</text><text x="20" y="132" fill="#475569" font-size="16">stats page</text><rect x="20" y="153" width="197" height="25" rx="12.5" fill="#FEF2F2"/><text x="118" y="170" text-anchor="middle" fill="#B91C1C" font-family="monospace" font-size="12">NO AUTH CHECK</text></g><path d="M313 250H363M353 241L363 250L353 259" fill="none" stroke="#64748B" stroke-width="2.5"/>
<g transform="translate(374 151)"><rect width="258" height="197" rx="15" fill="#0F172A"/><text x="20" y="34" fill="#93C5FD" font-family="monospace" font-size="15">API ROUTES</text><text x="20" y="72" fill="#FFFFFF" font-size="21" font-weight="700">GET / POST / DELETE</text><text x="20" y="104" fill="#CBD5E1" font-size="16">parameterized SQL</text><text x="20" y="132" fill="#CBD5E1" font-size="16">6–8 char code regex</text><text x="20" y="166" fill="#FDE68A" font-size="15">URL pattern checks</text></g><path d="M643 250H693M683 241L693 250L683 259" fill="none" stroke="#64748B" stroke-width="2.5"/>
